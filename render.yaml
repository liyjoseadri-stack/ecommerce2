services:
  - type: web
    name: ecommerce2
    env: docker
    region: oregon
    branch: main
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        scope: project # Tu APP_KEY: base64:w0Dh4JMn5S9CgynbkL46Ns+V9S8AXYG0UGsKHnCV43g=
      - key: APP_NAME
        value: E-Commerce
      - key: APP_URL
        value: https://tu-app-name.render.com # Asegúrate de que esta URL sea la de tu servicio en Render.
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: gateway01.us-east-1.prod.aws.tidbcloud.com
      - key: DB_PORT
        value: "4000"
      - key: DB_DATABASE
        value: ecommerce_db
      - key: DB_USERNAME
        scope: project # Tu DB_USERNAME: 3Xsa1BX9gtxfW9N.root
      - key: DB_PASSWORD
        scope: project # Tu DB_PASSWORD: CRlJucEdYYHDW4IN
      - key: DB_SSLMODE
        value: require
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        scope: project # Tu MAIL_USERNAME: liy.jose.adri@gmail.com
      - key: MAIL_PASSWORD
        scope: project # Tu MAIL_PASSWORD: utcsvkqzaotjsbrr
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        value: liy.jose.adri@gmail.com
      - key: MAIL_FROM_NAME
        value: "${APP_NAME}"
    preDeployCommand: >
      php artisan migrate:fresh --seed --force &&
      php artisan cache:clear &&
      php artisan config:clear &&
      php artisan route:clear &&
      php artisan view:clear
